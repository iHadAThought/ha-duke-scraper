name: Publish worker add-on images

on:
  push:
    branches: [main]
    paths:
      - "duke_scraper_worker/**"
      - ".github/workflows/publish-addon.yaml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_BASE: ghcr.io/ihadathought

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read add-on version
        id: meta
        run: |
          VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("duke_scraper_worker/config.yaml").read_text(encoding="utf-8")
          m = re.search(r'^version:\s*"([^"]+)"', text, re.M)
          if not m:
              raise SystemExit("version not found in config.yaml")
          print(m.group(1))
          PY
          )
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ${{ matrix.arch }} version ${VERSION}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: duke_scraper_worker
          file: duke_scraper_worker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-duke-scraper-worker:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-duke-scraper-worker:latest
          labels: |
            org.opencontainers.image.title=Duke Energy Scraper Worker
            org.opencontainers.image.source=https://github.com/iHadAThought/ha-duke-scraper
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            io.hass.version=${{ steps.meta.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}

      - name: Make package public
        continue-on-error: true
        env:
          PACKAGE: ${{ matrix.arch }}-duke-scraper-worker
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/vis.json -w "%{http_code}" -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/${PACKAGE}/visibility" \
            -d '{"visibility":"public"}')
          echo "visibility HTTP ${code}"
          cat /tmp/vis.json || true
          if [[ "$code" != "204" && "$code" != "200" ]]; then
            echo "::warning::Could not auto-set ${PACKAGE} public (GITHUB_TOKEN limitation)."
            echo "One-time manual step: Package settings → Change visibility → Public"
            echo "https://github.com/users/${{ github.repository_owner }}/packages/container/package/${PACKAGE}"
          fi
