name: Feature request
description: Suggest an enhancement for the integration or worker
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I understand this uses undocumented Duke Energy surfaces that may break
          required: true
        - label: This is not a request for official Duke Energy support
          required: true
